<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кармический банк — Вход</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #FFDAB9 60%, #FFE4B5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }
        input {
            padding: 14px;
            width: 240px;
            border-radius: 30px;
            border: 1px solid #FFD700;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        button {
            padding: 14px 40px;
            border-radius: 30px;
            background: linear-gradient(135deg, #A5D6A7, #FFB74D);
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { transform: scale(1.02); }
        #message { margin-top: 16px; color: #FF4500; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Кармический банк</h2>
        <input type="text" id="loginInput" placeholder="Логин">
        <br>
        <button onclick="doLogin()">Войти</button>
        <div id="message"></div>
    </div>

    <script>
        const API_URL = 'http://87.242.86.241:8000';  // ваш новый сервер

        async function doLogin() {
            const login = document.getElementById('loginInput').value.trim();
            if (!login) {
                document.getElementById('message').textContent = 'Введите логин';
                return;
            }
            try {
                const response = await fetch(API_URL + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: login })
                });
                const data = await response.json();
                if (data.status === 'ok') {
                    document.getElementById('message').style.color = '#32CD32';
                    document.getElementById('message').textContent = 'Вход выполнен! Добро пожаловать, ' + data.user_id;
                    // здесь можно сохранить сессию и перенаправить
                    localStorage.setItem('karmabank_user', data.user_id);
                    window.location.href = 'admin.html';  // если есть админка
                } else {
                    document.getElementById('message').textContent = 'Пользователь не найден';
                }
            } catch (e) {
                document.getElementById('message').textContent = 'Ошибка подключения к серверу';
            }
        }
    </script>
</body>
</html>
